name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The rules have to hold for the app they were written for. If this fails,
      # either the service picked up a violation or a rule has become too broad.
      - name: Check the service against its own rules
        run: npm run check -- service
